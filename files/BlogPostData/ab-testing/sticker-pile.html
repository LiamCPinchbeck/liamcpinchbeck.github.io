<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sticker pile</title>
<style>
  body { margin: 0; }
  .pile { position: relative; width: 100%; max-width: 720px; aspect-ratio: 16 / 10; margin: 0 auto; }
  .pile img {
    position: absolute; width: 130px;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 4px 6px rgba(0,0,0,.25));
  }
</style>
</head>
<body>
<!-- Swap the src for each logo file. Change left/top to move, rotate() to tilt, width to resize. -->
<div class="pile">
  <img src="https://en.wikipedia.org/wiki/Special:FilePath/Tesla_Motors.svg" alt="Tesla Logo" style="left:30%; top:30%; transform:translate(-50%,-50%) rotate(-12deg);">
  <img src="https://en.wikipedia.org/wiki/Special:FilePath/Edison_Motors_logo.svg" alt="Edison Motors Logo" style="left:55%; top:25%; transform:translate(-50%,-50%) rotate(8deg);">
  <img src="https://en.wikipedia.org/wiki/Special:FilePath/Ford_logo_flat.svg" alt="Ford Logo" style="left:78%; top:35%; transform:translate(-50%,-50%) rotate(-6deg);">
  <img src="https://en.wikipedia.org/wiki/Special:FilePath/Waymo_logo.svg" alt="Waymo Logo" style="left:20%; top:60%; transform:translate(-50%,-50%) rotate(10deg);">
  <img src="https://en.wikipedia.org/wiki/Special:FilePath/BYD_Auto_2022_logo.svg" alt="BYD Logo" style="left:45%; top:55%; transform:translate(-50%,-50%) rotate(-4deg);">
  <img src="https://en.wikipedia.org/wiki/Special:FilePath/Toyota.svg" alt="Toyota Logo" style="left:68%; top:62%; transform:translate(-50%,-50%) rotate(14deg);">
  <img src="https://en.wikipedia.org/wiki/Special:FilePath/Hyundai_Motor_Company_logo.svg" alt="Hyundai Logo" style="left:35%; top:80%; transform:translate(-50%,-50%) rotate(6deg);">
  <img src="https://en.wikipedia.org/wiki/Special:FilePath/Mercedes-Benz_Star_(1969-1986,_2025-).svg" alt="Mercedes Logo" style="left:60%; top:82%; transform:translate(-50%,-50%) rotate(-10deg);">
</div>
</body>
</html>
